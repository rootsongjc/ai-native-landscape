  <!-- Logo -->
  <g transform="translate(48 60) scale(1.0)"><rect x="4" y="4" width="24" height="56" rx="6" fill="#1f7ff0"/><rect x="32" y="4" width="28" height="32" rx="6" fill="#5aa9ff"/><rect x="32" y="40" width="28" height="20" rx="6" fill="#f59e0b"/></g>
  <!-- Title - HUGE, single line with icon -->
