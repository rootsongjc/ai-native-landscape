name: triage

on:
  issues:
    types: [opened, edited, labeled]
  issue_comment:
    types: [created]
  # Runs in the context of the base branch so the checks cannot be altered by a fork.
  # This workflow must never check out or execute code from the pull request.
  pull_request_target:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      number:
        description: 'Issue or pull request number (empty = all open)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (print the result without commenting, labeling, or closing)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: triage-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issues' && (github.event.action != 'labeled' || github.event.label.name == 'exception')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/recheck'))
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check submission against the inclusion standards
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || inputs.number }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=()
          if [ -n "$NUMBER" ]; then ARGS+=(--number "$NUMBER"); else ARGS+=(--all-open); fi
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          npm run triage -- "${ARGS[@]}"
