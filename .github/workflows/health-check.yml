name: health-check

on:
  schedule:
    # Run every Monday at 3:22 UTC (off-peak to avoid API congestion)
    - cron: '22 3 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no file changes)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - run: npm ci

      - name: Run health check
        id: health
        env:
          GITHUB_TOKEN: ${{ secrets.HEALTH_CHECK }}
          HEALTH_CHECK_REPORT: ${{ runner.temp }}/health-check-changes.md
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          node scripts/health-check.mjs $ARGS || echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Validate after changes
        if: steps.health.outputs.has_changes == 'true'
        run: npm run validate

      # Dead projects are deleted, not kept under another status. The workflow never
      # merges: a maintainer reviews the removals in the pull request.
      - name: Write PR description
        if: steps.health.outputs.has_changes == 'true'
        run: |
          {
            echo "Automated health check against the GitHub API."
            echo
            echo "- A project whose repo returns 404 (deleted, private or suspended) or is archived on GitHub is **removed**: both language files are deleted."
            echo "- A repo that was renamed or transferred gets its \`repo\` rewritten."
            echo
            echo "Check each removal before merging: a 404 can be temporary. Drop a removal from this PR to keep the project."
            echo
            echo "## Changes"
            echo
            cat "$RUNNER_TEMP/health-check-changes.md"
            echo
            echo "Generated by the \`health-check\` workflow."
          } > "$RUNNER_TEMP/health-check-pr.md"

      - name: Create PR for removals and repo changes
        if: steps.health.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: health-check/update-status
          title: 'health-check: remove dead projects and update moved repos'
          body-path: ${{ runner.temp }}/health-check-pr.md
          commit-message: 'chore: remove dead projects and update moved repos from health check'
          labels: health-check, automated
