name: Refresh stale project scores

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-project-scores
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run refresh:scores -- --report "$RUNNER_TEMP/score-refresh.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: score-refresh-report
          path: ${{ runner.temp }}/score-refresh.json
          if-no-files-found: warn
          retention-days: 7
