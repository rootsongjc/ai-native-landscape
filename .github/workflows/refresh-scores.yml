name: Refresh stale project scores

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: refresh-project-scores
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - id: refresh
        run: npm run refresh:scores -- --report "$RUNNER_TEMP/score-refresh.json"
      # Deleted or renamed repositories do not fail this job; the health check
      # verifies them against GitHub and opens a PR that removes or updates them.
      - name: Trigger health check for unavailable repositories
        if: steps.refresh.outputs.unavailable > 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run health-check.yml --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: score-refresh-report
          path: ${{ runner.temp }}/score-refresh.json
          if-no-files-found: warn
          retention-days: 7
