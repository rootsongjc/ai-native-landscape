name: sync-levels

on:
  schedule:
    # Mondays at 05:10 UTC, after the daily score refresh has collected fresh metrics.
    - cron: '10 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Sync signals and compute levels
        id: levels
        run: npm run sync:levels -- --report "$RUNNER_TEMP/level-changes.md"

      # Levels are computed, never hand-picked. The pull request is the public record of
      # promotions and demotions; it is only opened when a level actually changes.
      - name: Write PR description
        if: steps.levels.outputs.changes > 0
        run: |
          {
            echo "Weekly sync of \`data/signals.json\` from the score API."
            echo
            echo "Levels are computed from these signals against the standard in \`src/lib/levels.mjs\` (published on the methodology page). Do not edit individual entries: to change an outcome, change the standard for every project."
            echo
            echo "## Level changes"
            echo
            cat "$RUNNER_TEMP/level-changes.md"
            echo
            echo "Generated by the \`sync-levels\` workflow."
          } > "$RUNNER_TEMP/sync-levels-pr.md"

      - name: Create PR for level changes
        if: steps.levels.outputs.changes > 0
        uses: peter-evans/create-pull-request@v8
        with:
          branch: sync-levels/update
          title: 'sync-levels: update project levels'
          body-path: ${{ runner.temp }}/sync-levels-pr.md
          commit-message: 'chore: sync project signals and levels'
          add-paths: data/signals.json
          labels: automated
